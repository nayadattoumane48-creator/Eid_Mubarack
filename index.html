<!DOCTYPE html>
<html lang="en">
<head>
    <script>

            function blink()
            {
                let p = document.querySelector('');
                if (p.style.visibility == 'hidden')
            {
                p.style.visibility = 'visible';
            }
            else
            {
                p.style.visibility = 'hidden';
            }
            }

            window.setInterval(blink, 1000);

    </script>
