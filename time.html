<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time</title>
    <script>
        let counter = 10;
        let intervalId;

        function count() {
            counter--;
            document.querySelector('h1').innerHTML = counter;
            if (counter == 0) {
                clearInterval(intervalId);
                window.location.href = "gift.html";
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            setInterval(count, 2000);
        });
    </script>

    <style>

        h1 {
            margin-left: 90px;
            font-size: 120px;
            font-weight: bold;
        }

        body {
            background: linear-gradient(rgb(64, 255, 0), rgb(0, 217, 255), rgb(34, 1, 253));
            margin-bottom: 50%;
            margin-right: 60%;
            margin-left: 1%;
            margin-top: 0;
            min-height: 60vh;
            
        }

        div {
            font-size: 18px;
            margin: 0;
            margin-top: 0;
        }

    </style>
</head>
<body>
    <div><b>Nayad:</b> Patientez s'il vous plait dans..</div>
    <h1>10</h1>
    
</body>
</html>
